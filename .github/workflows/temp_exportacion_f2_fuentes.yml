name: Exportacion TEMPORAL F2 de fuentes SIN JUEGO
on:
  push:
    branches: [integracion-eventos-segura-20261120]
permissions:
  contents: read
jobs:
  export-f2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empaquetar fuentes permitidas
        run: |
          if git ls-files | grep -Ei '\.(iso|cso|pbp|7z|bps|exe)$'; then
            echo 'ERROR: recursos comerciales presentes'; exit 1
          fi
          tar -czf "$RUNNER_TEMP/cladun_f2_sources.tar.gz" --exclude='.git' \
            AGENTS.md README.md .github tools tests corpus traduccion qa reports \
            patcher lectura docs prompts referencias
      - uses: actions/upload-artifact@v4
        with:
          name: cladun_f2_sources_no_game
          path: ${{ runner.temp }}/cladun_f2_sources.tar.gz
          retention-days: 1
          if-no-files-found: error
