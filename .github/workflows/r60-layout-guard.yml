name: R60 typography guard (synthetic)
on:
  push:
    branches: [beta-r60-tipografia-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_r60_layout_guard.py' -v
