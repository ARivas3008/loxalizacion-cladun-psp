# Temporal: binario oficial del emulador, NUNCA se versiona ni se sube ISO.
name: Obtener PPSSPP 1.20.4 oficial para QA F1
on:
  push:
    branches: [integracion-eventos-segura-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ppsspp-f1:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar AppImage oficial PPSSPP 1.20.4
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/hrydgard/ppsspp/releases/download/v1.20.4/PPSSPP-v1.20.4-anylinux-x86_64.AppImage \
            --output "$RUNNER_TEMP/PPSSPP-v1.20.4-anylinux-x86_64.AppImage"
          echo '661c098e6b7f7610171a57b7c533ce8bba6f2312b71e76d61e850461973eba21  '"$RUNNER_TEMP/PPSSPP-v1.20.4-anylinux-x86_64.AppImage" | sha256sum -c -
      - name: Entregar AppImage original como artefacto temporal
        uses: actions/upload-artifact@v4
        with:
          name: PPSSPP_1_20_4_oficial_F1
          path: ${{ runner.temp }}/PPSSPP-v1.20.4-anylinux-x86_64.AppImage
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
