name: Validación del corpus
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  integridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencia de gráficos para la localización de rótulos
        run: python -m pip install 'Pillow>=12,<14'
      - name: Probar integridad, fuente y prevención de desbordes
        run: python -m unittest discover -s tests -v
      - name: Verificar fuente, índices y TXT
        run: python tools/verificar_integridad.py --raiz .
      - name: Verificar que los textos originales y marcadores no cambian
        run: python tools/verificar_borrador_es.py
      - name: Inventario estático de riesgos de reinserción (no es aprobación)
        run: |
          python tools/auditar_preinsercion_es.py --reporte reports/preinsercion_ci.json --filas reports/preinsercion_ci.csv
      - name: Medir integrabilidad append-only sin crear ISO
        run: python tools/reportar_integrabilidad_es.py --reporte reports/integrabilidad_ci.json
      - name: Conservar informes de QA (sin activos comerciales)
        uses: actions/upload-artifact@v4
        with:
          name: cladun-qa-preinsercion
          path: |
            reports/preinsercion_ci.json
            reports/preinsercion_ci.csv
            reports/integrabilidad_ci.json
