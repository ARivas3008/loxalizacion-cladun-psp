name: Paquete de fuentes para auditoria local (sin assets comerciales)
on:
  push:
    branches: [integracion-eventos-segura-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuentes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar exclusiones de assets comerciales del snapshot
        run: |
          if git ls-files | grep -Ei '\.(iso|cso|pbp|7z)$'; then
            echo 'RECHAZADO: imagenes comerciales versionadas'; exit 1
          fi
      - name: Empaquetar fuentes y corpus (excluir BPS y ejecutables)
        run: tar --exclude='*.bps' --exclude='*.exe' -czf /tmp/cladun-fuentes-auditoria.tar.gz tools patcher tests corpus traduccion docs qa reports .github README.md AGENTS.md
      - name: Publicar snapshot de auditoria textual
        uses: actions/upload-artifact@v4
        with:
          name: cladun-fuentes-auditoria
          path: /tmp/cladun-fuentes-auditoria.tar.gz
          retention-days: 1
