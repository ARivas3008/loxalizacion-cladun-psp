name: F2 TEMPORAL exportar código público sin binarios
on:
  push:
    branches: [integracion-eventos-segura-20261120]
permissions:
  contents: read
jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar paquete solo de código y documentación
        run: |
          python3 - <<'PY'
          import pathlib,tarfile,subprocess
          root=pathlib.Path('.')
          allowed={'.py','.md','.json','.go','.mod','.sum','.yml','.yaml','.csv','.txt','.toml','.sh','.gitignore','.gitattributes'}
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          selected=[]
          for p in paths:
            if not p:continue
            path=root/p
            if not path.is_file() or path.is_symlink():continue
            if path.suffix.lower() in allowed or path.name in ('go.mod','go.sum','Makefile'):
              if any(v in p.lower() for v in ('/private/','/iso/','/artifacts/')):continue
              selected.append(path)
          with tarfile.open('/tmp/cladun-f2-codigo.tar.gz','w:gz') as out:
            for path in selected:out.add(path,arcname=str(path),recursive=False)
          print('selected',len(selected))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: f2-codigo-publico-solo-texto-20261123
          path: /tmp/cladun-f2-codigo.tar.gz
          retention-days: 1
