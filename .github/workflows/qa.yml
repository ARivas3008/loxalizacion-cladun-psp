name: Calidad del corpus
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar corpus sin usar ISO
        run: python tools/validar_corpus.py
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
