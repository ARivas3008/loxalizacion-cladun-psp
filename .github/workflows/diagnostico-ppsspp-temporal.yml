name: Diagnóstico temporal PPSSPP Linux
on:
  push:
    paths:
      - .github/workflows/diagnostico-ppsspp-temporal.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar ejecutable oficial Linux de PPSSPP 1.20.4
        run: |
          curl --fail --location --retry 3 --max-time 150 \
            --output PPSSPP-v1.20.4-anylinux-x86_64.AppImage \
            https://github.com/hrydgard/ppsspp/releases/download/v1.20.4/PPSSPP-v1.20.4-anylinux-x86_64.AppImage
          file PPSSPP-v1.20.4-anylinux-x86_64.AppImage
          sha256sum PPSSPP-v1.20.4-anylinux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: pp-emu-diagnostico-temporal
          path: PPSSPP-v1.20.4-anylinux-x86_64.AppImage
          retention-days: 1
