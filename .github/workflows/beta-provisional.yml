name: Beta provisional (sin ISO)
on:
  push:
    branches: [beta-provisional-r52-20261125]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beta-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=12,<14'
      - run: python -m unittest discover -s tests -p 'test_beta_provisional.py' -v
      - run: python -m unittest discover -s tests -p 'test_r52_local_optimized.py' -v
      - run: python -m unittest discover -s tests -p 'test_r55_private_accumulated.py' -v
      - run: python -m unittest discover -s tests -p 'test_r56_native_ellipsis.py' -v
