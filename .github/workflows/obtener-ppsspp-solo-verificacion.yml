name: PPSSPP oficial portable para verificación local (sin contenido de juegos)
on:
  push:
    branches: [evidencia-emulador-20261120]
permissions:
  contents: read
jobs:
  ppsspp:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar PPSSPP oficial 1.20.4 para Linux x86_64
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 --silent --show-error \
            https://github.com/hrydgard/ppsspp/releases/download/v1.20.4/PPSSPP-v1.20.4-anylinux-x86_64.AppImage \
            -o /tmp/PPSSPP-v1.20.4-anylinux-x86_64.AppImage
          file /tmp/PPSSPP-v1.20.4-anylinux-x86_64.AppImage
          test "$(stat -c %s /tmp/PPSSPP-v1.20.4-anylinux-x86_64.AppImage)" -ge 50000000
      - name: Descargar PPSSPP para ensayo local
        uses: actions/upload-artifact@v4
        with:
          name: ppsspp-oficial-v1.20.4-linux-x86-64
          path: /tmp/PPSSPP-v1.20.4-anylinux-x86_64.AppImage
          retention-days: 1
